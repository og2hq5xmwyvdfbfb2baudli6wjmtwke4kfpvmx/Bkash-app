<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Andro Control{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        const FIREBASE_URL = "{{ firebase_url }}";
        if (!firebase.apps.length) {
            firebase.initializeApp({ databaseURL: FIREBASE_URL });
        }
        const fbDb = firebase.database();
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div style="max-width: 1400px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;">
            <a href="/" class="navbar-brand">
                <span class="brand-icon"><i class="fas fa-satellite-dish"></i></span>
                ANDRO CONTROL
            </a>
            <div style="display: flex; align-items: center; gap: 8px;">
                <a href="/" class="nav-link"><i class="fas fa-hammer me-1"></i> Builder</a>
                <span class="live-badge"><span class="live-dot"></span> SYSTEM ACTIVE</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="max-width: 1400px; margin: 0 auto; padding: 32px 24px;">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
